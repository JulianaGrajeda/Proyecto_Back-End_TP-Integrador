<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>DASHBOARD SKINCORE</title>
        <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        <link rel="stylesheet" href="/src/public/css/styles.css">
    </head>
    <body class="pagina-inicio">
        <!-- encabezado -->
        <header class="header-totem">

            <div class="icon">
                <img src="../public/img/logo.png" alt="Logo SKINCORE">
                <h1>SKINCORE</h1>
            </div>

            <p> VISTA DE ADMINISTRADOR</p>
            
            <nav class="nav">
                <ul>
                    <li><a href="">INICIO</a></li>
                    <li><a href="">BORRAR</a></li>
                    <li><a href="">AGREGAR</a></li>
                    <li><a href="">MODIFICAR</a></li>
                </ul>
            </nav>

        </header>

        <!-- contenido principal -->
        <main class="main-totem">

            <!-- Contenedor donde se mostrarán los productos de la api/products -->
            <section id="contenedor-productos"></section>

        </main>

        <!-- Footer -->

        <footer class="footer">
            <div class="footer-container">
                <!-- LOGO -->
                <img src="../public/img/logo.png" alt="Logo de la empresa">

                <div class="footer-content">
                    <p>&copy; 2026 SKINCORE. Todos los derechos reservados.</p>
                    <p>Programación III - División 132 | Proyecto Integrador 2026</p>
                    <p>Altube Renata - Grajeda Juliana</p>

                </div>
            </div>
        </footer>

        <!-- Carga de Scripts JS -->
        <script>
            const contenedorProductos = document.getElementById("contenedor-productos");

            async function obtenerProductos() {
                const urlBase = "http://localhost:3000";

                //solicitud GET a http://localhost:3000/api/products
                const response = await fetch(`${urlBase}/api/products`);
                console.log(response);

                const data = await response.json();
                const productos = data.payload;
                console.table(productos);

                renderizarProductos(productos);

            }

            function renderizarProductos(array){
                let htmlProductos = "";

                array.forEach(prod => {
                    htmlProductos += `
                    <div class="card-producto">
                        <img src="${prod.imagen}" alt="${prod.nombre_prod}">
                        <h3>${prod.nombre_prod}</h3>
                        <p>${prod.id}</p>
                        <p>$${prod.precio_prod}</p>
                    </div>
                    `;
                });

                contenedorProductos.innerHTML = htmlProductos;
            }

            obtenerProductos();

        </script>
    </body>
</html>
